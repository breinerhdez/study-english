<title>English Studio</title>
<script>
/* Layout: "rail" (menú lateral) solo en pantallas anchas con mouse, o ≥1024px y alto suficiente (tablet/TV).
   Un teléfono, incluso girado o con "sitio de escritorio", usa siempre la barra inferior. */
(function () {
  var q = matchMedia("(min-width: 760px) and (pointer: fine), (min-width: 1024px) and (min-height: 521px)");
  function set() { var phone = Math.min(screen.width, screen.height) < 600; document.documentElement.setAttribute("data-layout", q.matches && !phone ? "rail" : "bar"); }
  set(); (q.addEventListener ? q.addEventListener("change", set) : q.addListener(set));
})();
</script>
